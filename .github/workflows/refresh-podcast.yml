name: Refresh podcast episodes
on:
  schedule:
    # Saturday 6:30pm KL and Sunday 10:00am KL, after the weekly 6pm publish.
    - cron: '30 10 * * 6'
    - cron: '0 2 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun scripts/refresh-podcast.ts
      - name: Commit updated episode cache
        run: |
          if git diff --quiet -- src/data/podcast-cache.json; then
            echo "Podcast cache already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/podcast-cache.json
          git commit -m "Refresh podcast episodes from YouTube"
          git push
