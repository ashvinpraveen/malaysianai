<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 880 880" role="img" aria-labelledby="title description">
	<title id="title">Malaysian AI black and white batik emblem</title>
	<desc id="description">A black and white animated geometric emblem based on the Malaysian AI mark, filled with a moving batik bunga and canting-line pattern.</desc>
	<defs>
		<filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".34" />
		</filter>
		<filter id="ink-wobble" x="-10%" y="-10%" width="120%" height="120%">
			<feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="19" result="noise" />
			<feDisplacementMap in="SourceGraphic" in2="noise" scale="1.35" />
		</filter>

		<pattern id="batik" width="88" height="88" patternUnits="userSpaceOnUse">
			<rect width="88" height="88" fill="#1a1a1a" />
			<path d="M0 44Q22 22 44 44T88 44M44 0Q22 22 44 44T44 88" fill="none" stroke="#ffffff" stroke-width="3" opacity=".72" />
			<path d="M44 32C37 23 26 26 27 36c1 7 9 9 17 8-1-8-3-16-10-18M56 44c9-7 6-18-4-17-7 1-9 9-8 17 8-1 16-3 18-10M44 56c7 9 18 6 17-4-1-7-9-9-17-8 1 8 3 16 10 18M32 44c-9 7-6 18 4 17 7-1 9-9 8-17-8 1-16 3-18 10" fill="#f5f5f2" stroke="#9d9d9d" stroke-width="2" />
			<circle cx="44" cy="44" r="5" fill="#ffffff" stroke="#080808" stroke-width="2" />
			<circle cx="0" cy="0" r="4" fill="#9d9d9d" />
			<circle cx="88" cy="0" r="4" fill="#9d9d9d" />
			<circle cx="0" cy="88" r="4" fill="#9d9d9d" />
			<circle cx="88" cy="88" r="4" fill="#9d9d9d" />
			<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="88 88" dur="18s" repeatCount="indefinite" />
		</pattern>

		<path id="emblem" d="M72 76H292L400-18 508 76H728V292L818 400 728 508V724H508L400 818 292 724H72V508L-18 400 72 292Z" />
		<clipPath id="emblem-clip">
			<use href="#emblem" />
		</clipPath>

		<g id="crown">
			<path d="M274 173 400 46l126 127" />
			<path d="M302 201 400 103l98 98" />
			<path d="M332 230 400 162l68 68" />
		</g>

		<g id="arrow">
			<path d="M45 400 186 259l49 49-92 92 92 92-49 49Z" fill="url(#batik)" />
			<path d="M83 400 188 295l22 22-83 83 83 83-22 22Z" />
		</g>

		<g id="corner-sprig">
			<path d="M111 226V134h92M111 165l58 58M116 171l-18-19 4-30 30 4 19 18M156 211l23-5 17-17" />
			<path d="M144 141c20-20 46-22 64-8-4 25-23 43-51 39" />
		</g>
	</defs>

	<style>
		:root { color-scheme: light dark; }
		.logo-shell { transform-origin: 400px 400px; animation: arrive 1.1s .05s cubic-bezier(.16,.82,.2,1) both; }
		.crown { fill: none; stroke: #ffffff; stroke-width: 24; stroke-linecap: square; stroke-linejoin: miter; }
		.crown-shadow { fill: none; stroke: #080808; stroke-width: 40; stroke-linecap: square; stroke-linejoin: miter; }
		.arrow-dark { fill: none; stroke: #080808; stroke-width: 35; stroke-linejoin: miter; }
		.arrow-light { fill: none; stroke: #ffffff; stroke-width: 18; stroke-linejoin: miter; }
		.trace { stroke-dasharray: 1300; stroke-dashoffset: 1300; animation: draw 1.65s .18s cubic-bezier(.4,0,.15,1) forwards; }
		.sprig { fill: none; stroke: #ffffff; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
		.sprig-accent { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; }
		.arrow-dark, .arrow-light, .sprig, .sprig-accent { transform-box: fill-box; transform-origin: center; animation: detail-in .7s .28s ease-out both; }
		.spark { transform-box: fill-box; transform-origin: center; animation: spark-in .6s .46s ease-out both, turn 8s 1.25s ease-in-out infinite alternate; }
		.bloom { transform-box: fill-box; transform-origin: center; animation: bloom-in .65s .36s cubic-bezier(.2,.9,.2,1.2) both, breathe 3.4s 1.15s ease-in-out infinite; }
		@keyframes arrive { from { opacity: 0; transform: scale(0) rotate(-12deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
		@keyframes draw { to { stroke-dashoffset: 0; } }
		@keyframes detail-in { from { opacity: 0; transform: scale(.72); } }
		@keyframes spark-in { from { opacity: 0; transform: scale(0) rotate(-45deg); } }
		@keyframes bloom-in { from { opacity: 0; transform: scale(0); } }
		@keyframes turn { to { transform: rotate(90deg); } }
		@keyframes breathe { 50% { transform: scale(1.09); } }
		@media (prefers-reduced-motion: reduce) {
			.logo-shell, .trace, .spark, .bloom { animation: none; }
			.arrow-dark, .arrow-light, .sprig, .sprig-accent { animation: none; }
			.trace { stroke-dashoffset: 0; }
		}
	</style>

	<g class="logo-shell" filter="url(#soft-shadow)">
		<use href="#emblem" fill="#080808" stroke="#080808" stroke-width="34" stroke-linejoin="miter" />
		<use href="#emblem" fill="url(#batik)" stroke="#ffffff" stroke-width="17" stroke-linejoin="miter" />
		<use href="#emblem" fill="none" stroke="#080808" stroke-width="5" stroke-linejoin="miter" opacity=".78" />

		<g clip-path="url(#emblem-clip)" filter="url(#ink-wobble)">
			<rect x="58" y="62" width="684" height="676" rx="4" fill="none" stroke="#080808" stroke-width="43" />
			<rect x="58" y="62" width="684" height="676" rx="4" fill="none" stroke="#ffffff" stroke-width="19" />

			<g class="crown-shadow"><use href="#crown" /><use href="#crown" transform="rotate(90 400 400)" /><use href="#crown" transform="rotate(180 400 400)" /><use href="#crown" transform="rotate(270 400 400)" /></g>
			<g class="crown trace"><use href="#crown" /><use href="#crown" transform="rotate(90 400 400)" /><use href="#crown" transform="rotate(180 400 400)" /><use href="#crown" transform="rotate(270 400 400)" /></g>

			<g class="arrow-dark"><use href="#arrow" /><use href="#arrow" transform="rotate(90 400 400)" /><use href="#arrow" transform="rotate(180 400 400)" /><use href="#arrow" transform="rotate(270 400 400)" /></g>
			<g class="arrow-light"><use href="#arrow" /><use href="#arrow" transform="rotate(90 400 400)" /><use href="#arrow" transform="rotate(180 400 400)" /><use href="#arrow" transform="rotate(270 400 400)" /></g>

			<rect x="234" y="234" width="332" height="332" fill="#080808" stroke="#ffffff" stroke-width="17" />
			<rect x="267" y="267" width="266" height="266" fill="url(#batik)" stroke="#ffffff" stroke-width="7" />
			<path class="trace" d="M267 364v-97h97M436 267h97v97M533 436v97h-97M364 533h-97v-97" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="square" />
			<path d="M300 375v-75h75M425 300h75v75M500 425v75h-75M375 500h-75v-75" fill="none" stroke="#080808" stroke-width="19" stroke-linecap="square" />

			<g class="sprig"><use href="#corner-sprig" /><use href="#corner-sprig" transform="rotate(90 400 400)" /><use href="#corner-sprig" transform="rotate(180 400 400)" /><use href="#corner-sprig" transform="rotate(270 400 400)" /></g>
			<g class="sprig-accent"><use href="#corner-sprig" /><use href="#corner-sprig" transform="rotate(90 400 400)" /><use href="#corner-sprig" transform="rotate(180 400 400)" /><use href="#corner-sprig" transform="rotate(270 400 400)" /></g>
		</g>

		<g class="bloom">
			<path d="M400 331c-17-31-50-22-48 6 1 23 24 33 48 31-2-24-12-47-35-48M469 400c31-17 22-50-6-48-23 1-33 24-31 48 24-2 47-12 48-35M400 469c17 31 50 22 48-6-1-23-24-33-48-31 2 24 12 47 35 48M331 400c-31 17-22 50 6 48 23-1 33-24 31-48-24 2-47 12-48 35" fill="#9d9d9d" stroke="#ffffff" stroke-width="8" />
			<circle cx="400" cy="400" r="24" fill="#ffffff" stroke="#080808" stroke-width="8" />
		</g>

		<g class="spark" fill="#ffffff" stroke="#ffffff" stroke-width="7">
			<path d="m400 214 25 25-25 25-25-25Z" />
			<path d="m586 400 25 25-25 25-25-25Z" />
			<path d="m400 586 25 25-25 25-25-25Z" />
			<path d="m214 400 25 25-25 25-25-25Z" />
		</g>
	</g>
</svg>
